<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fb">
<title>Odbavení řidiče – interaktivní demo</title>
<style>
:root{--ink:#142239;--blue:#1658de;--blue-dark:#1043ac;--muted:#63738a;--line:#dae2ed;--bg:#f6f8fb;--green:#148053}
*{box-sizing:border-box}
html,body{width:100%;min-height:100%;margin:0}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid #79a9ff;outline-offset:4px}
main{min-height:100svh;display:grid;place-items:center;padding:clamp(18px,3.4vw,55px)}
.page{display:none;width:100%;max-width:1140px;animation:fade .18s ease-out}
.page.active{display:flex;flex-direction:column;align-items:center;justify-content:center}
@keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
h1{font-size:clamp(36px,4.25vw,67px);line-height:1.1;letter-spacing:-.045em;font-weight:800;text-align:center;margin:0 0 32px}
.lang-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;width:100%}
.lang{min-height:111px;border:2px solid var(--line);border-radius:17px;background:white;color:var(--ink);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;transition:background .13s,border-color .13s}
.lang:hover,.lang:focus-visible{background:#edf4ff;border-color:var(--blue)}
.flag{display:block;width:61px;height:41px;box-shadow:0 1px 5px #0002;border-radius:4px;overflow:hidden;line-height:0}
.flag svg{width:100%;height:100%;display:block}
.lang span:last-child{font-weight:700;font-size:clamp(13px,1.2vw,17px)}
#preparePage,#scanPage,#resultPage{min-height:calc(100svh - 110px)}
#preparePage h1{margin-bottom:42px}
.large-btn{border:0;border-radius:17px;background:var(--blue);color:#fff;font-size:clamp(18px,2.1vw,29px);font-weight:750;min-height:85px;padding:23px 45px;max-width:100%;box-shadow:0 12px 23px #1658de26;transition:background .15s}
.large-btn:hover:not(:disabled){background:var(--blue-dark)}
.large-btn:disabled{opacity:.5;cursor:default}
.scanner{position:relative;width:min(100%,980px);height:clamp(310px,49svh,560px);border-radius:21px;overflow:hidden;background:linear-gradient(130deg,#717f87 0%,#9b9f9d 42%,#838988 100%);box-shadow:0 17px 45px #162d4833;margin-bottom:26px;isolation:isolate}
.scanner:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(1deg,transparent 0 28px,#26323812 28px 30px),repeating-linear-gradient(92deg,transparent 0 67px,#ffffff0e 67px 69px),radial-gradient(ellipse at 25% 23%,#ffffff50,transparent 65%);opacity:.85}
.scanner:after{content:"";position:absolute;top:0;bottom:0;left:9%;width:9px;background:#e5d784cc;box-shadow:1px 0 2px #4b4d4f55;transform:rotate(-5deg)}
.paper{position:absolute;left:50%;top:49%;width:min(43%,335px);min-width:220px;aspect-ratio:.81;transform:translate(-50%,-50%) rotate(-5deg);border-radius:5px;background:#f5f5f1;box-shadow:0 9px 34px #0006;padding:clamp(15px,2vw,26px);color:#2a3340;z-index:1}
.paper-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:2px solid #c3cbd0;font-weight:800;font-size:clamp(15px,1.6vw,23px)}
.paper-head small{font-size:10px;font-weight:600}
.paper-line{height:8px;margin-top:15px;background:#bdc6cc;border-radius:2px;opacity:.9}
.paper-line.short{width:62%}.paper-line.mid{width:83%}
.paper-row{display:flex;justify-content:space-between;border-bottom:1px solid #bfc8cf;padding:13px 0 7px;font-size:clamp(9px,1vw,12px)}
.paper-row strong{font-weight:800}
.paper-bars{margin-top:20px;height:34px;width:75%;background:repeating-linear-gradient(90deg,#1c2c36 0 3px,transparent 3px 6px,#1c2c36 6px 7px,transparent 7px 13px,#1c2c36 13px 18px,transparent 18px 22px)}
.scan-frame{position:absolute;inset:8% 25%;border:3px solid #ffffffcc;border-radius:12px;z-index:2;box-shadow:0 0 0 800px #081b302a;pointer-events:none}
.scan-frame:before,.scan-frame:after{content:"";position:absolute;background:#33ffbb;box-shadow:0 0 12px #33ffbb88}
.scan-frame:before{height:5px;left:-3px;right:-3px;top:0}
.scan-frame:after{height:5px;left:-3px;right:-3px;bottom:0}
.scan-beam{position:absolute;top:11%;left:26%;width:48%;height:4px;background:#45f9bd;box-shadow:0 0 20px 7px #43f6bf55;z-index:3;opacity:0;pointer-events:none}
.scanner.working .scan-beam{opacity:1;animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{from{top:10%}to{top:88%}}
#scanPage h1{margin-bottom:24px}
.scan-actions{width:100%;display:flex;justify-content:center;align-items:center;gap:16px}
#scanStatus{min-height:24px;color:var(--muted);font-size:18px;text-align:center;margin:16px 0 0}
#resultPage{gap:0}
.success{width:86px;height:86px;border-radius:50%;background:#e1f5ea;color:var(--green);display:grid;place-items:center;font-size:48px;font-weight:bold;margin-bottom:21px}
#resultPage h1{font-size:clamp(31px,3.8vw,56px);margin:0 0 27px}
.bay{color:var(--blue);font-size:clamp(110px,19vw,255px);font-weight:850;letter-spacing:-.09em;line-height:.95;text-align:center;position:relative;padding-right:.1em}
.bay-label{text-align:center;font-size:clamp(23px,3.5vw,43px);font-weight:750;margin-bottom:1px}
.details{display:flex;justify-content:center;flex-wrap:wrap;gap:30px 60px;margin:32px 0 40px;font-size:clamp(14px,1.6vw,19px)}
.details div{text-align:center}.details small{display:block;font-size:.75em;color:var(--muted);margin-bottom:6px}.details strong{font-weight:750}
.restart{background:transparent;border:2px solid var(--line);border-radius:14px;padding:15px 24px;font-weight:700;color:var(--ink);font-size:17px}
.restart:hover{border-color:var(--blue);color:var(--blue)}
@media(max-width:700px){main{padding:22px 16px}.lang-grid{grid-template-columns:repeat(3,1fr);gap:9px}.lang{min-height:90px;border-radius:12px;gap:9px}.flag{width:44px;height:31px}.lang span:last-child{font-size:12px}#languagePage h1{font-size:clamp(32px,7vw,50px);margin:0 0 23px}#preparePage,#scanPage,#resultPage{min-height:calc(100svh - 44px)}#preparePage h1{font-size:clamp(35px,8.5vw,62px);margin-bottom:35px}.large-btn{min-height:76px;width:100%;padding:18px 20px}#scanPage h1{font-size:clamp(32px,7vw,46px)}.scanner{height:clamp(310px,47svh,520px);border-radius:13px}.scan-frame{inset:12% 14%}.scan-beam{left:15%;width:70%}.scanner:after{left:4%}.paper{width:63%;min-width:195px;padding:15px}.paper-row{padding:9px 0 6px}.paper-line{margin-top:10px}.paper-bars{margin-top:12px}.details{gap:18px 27px;margin:26px 0 34px}.success{width:68px;height:68px;font-size:37px;margin-bottom:18px}}
@media(max-width:360px){.lang-grid{grid-template-columns:repeat(2,1fr)}.lang{min-height:78px}.scanner{height:310px}.paper{min-width:180px}}
@media(prefers-reduced-motion:reduce){.page{animation:none}.scanner.working .scan-beam{animation:none;top:48%}}
</style>
</head>
<body>
<main>
<section class="page active" id="languagePage" aria-label="Výběr jazyka">
<h1 id="languageTitle">Vyberte jazyk</h1>
<div class="lang-grid" id="languageGrid"></div>
</section>
<section class="page" id="preparePage">
<h1 id="prepareTitle">Připravte si dokumenty.</h1>
<button class="large-btn" type="button" id="readyButton">Mám dokumenty připravené</button>
</section>
<section class="page" id="scanPage">
<h1 id="scanTitle">Naskenujte dokument.</h1>
<div class="scanner" id="scanner" role="img" aria-label="Simulovaný náhled kamery s přepravním dokladem">
  <div class="paper" aria-hidden="true">
    <div class="paper-head">CMR <small>DELIVERY NOTE</small></div>
    <div class="paper-row"><span>Document no.</span><strong>DN-2026-10482</strong></div>
    <div class="paper-row"><span>Truck</span><strong>4AZ 2196</strong></div>
    <div class="paper-row"><span>Carrier</span><strong>ACME Transport</strong></div>
    <div class="paper-row"><span>Load</span><strong>24 PALLETS</strong></div>
    <div class="paper-line mid"></div><div class="paper-line short"></div><div class="paper-bars"></div>
  </div>
  <div class="scan-frame"></div><div class="scan-beam"></div>
</div>
<button class="large-btn" id="scanButton" type="button">Spustit skenování</button>
<div id="scanStatus" aria-live="polite"></div>
</section>
<section class="page" id="resultPage">
<div class="success" aria-hidden="true">✓</div>
<h1 id="resultTitle">Pokračujte na rampu.</h1>
<div class="bay-label" id="dockLabel">VAŠE RAMPA</div>
<div class="bay">12</div>
<div class="details"><div><small id="plateLabel">Registrační značka</small><strong>4AZ 2196</strong></div><div><small id="documentLabel">Číslo dokumentu</small><strong>DN-2026-10482</strong></div></div>
<button class="restart" type="button" id="restartButton">Nový řidič</button>
</section>
</main>

const $=id=>document.getElementById(id);
let language='cs',processing=false,activeTimer=null,stageTimers=[];
const copy=index=>(localeStrings[language]||localeStrings.cs)[index]||localeStrings.cs[index];
function translate(){
  for(const [id,index] of Object.entries({prepareTitle:2,readyButton:7,scanTitle:8,scanButton:10,resultTitle:17,dockLabel:19,plateLabel:21,documentLabel:23,restartButton:26}))$(id).textContent=copy(index);
}
function show(id){
  for(const el of document.querySelectorAll('.page'))el.classList.toggle('active',el.id===id);
  $(id).setAttribute('tabindex','-1');$(id).focus({preventScroll:true});window.scrollTo(0,0);
}
function resetScan(){
  if(activeTimer!==null)clearTimeout(activeTimer);
  stageTimers.forEach(clearTimeout);stageTimers=[];activeTimer=null;processing=false;
  $('scanner').classList.remove('working');$('scanButton').disabled=false;$('scanStatus').textContent='';
}
function scan(){
  if(processing)return;processing=true;$('scanButton').disabled=true;
  $('scanner').classList.add('working');
  const times=[0,850,1700,2550];
  times.forEach((time,i)=>stageTimers.push(setTimeout(()=>$('scanStatus').textContent=copy(12+i),time)));
  activeTimer=setTimeout(()=>{resetScan();show('resultPage')},3600);
}
for(const [code,country,name] of languages){
  const b=document.createElement('button');b.type='button';b.className='lang';b.lang=code;b.setAttribute('aria-label',name);
  b.innerHTML=`<span class="flag" aria-hidden="true"><svg viewBox="0 0 39 27" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${flagSvg[country]}</svg></span><span></span>`;
  b.lastElementChild.textContent=name;
  b.addEventListener('click',()=>{language=code;document.documentElement.lang=code;translate();show('preparePage')});
  $('languageGrid').appendChild(b);
}
$('readyButton').addEventListener('click',()=>{resetScan();show('scanPage')});
$('scanButton').addEventListener('click',scan);
$('restartButton').addEventListener('click',()=>{resetScan();language='cs';document.documentElement.lang='cs';translate();show('languagePage')});
translate();
})();
</script>
